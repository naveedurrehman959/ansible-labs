---
- name: advanced service management
  hosts: all
  become: yes
  tasks:
    - name: install and configure ssh service 
      block:
        - name: ensure ssh is installed
          package:
            name: "{{ 'openssh-server' if ansible_os_family == 'Debian' else 'openssh-server' }}"
            state: present
        - name: start ssh service
          service:
            name: "{{ 'ssh' if ansible_os_family =='Debian' else 'sshd' }}"
            state: started
            enabled: yes
        - name: reload ssh service configuration
          service:
            name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
            state: reloaded
    - name: manage firewall service on red hat family
      block:
        - name: install firewall service on red hat
          yum:
            name: firewalld
            state: present
          when: ansible_os_family == 'RedHat'
        - name: start firewall service
          service:
            name: firewalld
            state: started
            enabled: yes
          when: ansible_os_family == 'RedHat'
        - name: installing ufw package on Debian
          apt:
            name: ufw
            state: present
          when: ansible_os_family == 'Debian'
        - name: start and enable 
          service:
            name: ufw
            state: started
            enabled: yes
          when: ansible_os_family == 'Debian'
